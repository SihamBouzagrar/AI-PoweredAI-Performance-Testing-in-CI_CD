name: ai-performance-platform

services:

  ####################################################################
  # FastAPI - AI Performance Testing Platform
  ####################################################################
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-performance-platform
    # init:true fait tourner un vrai process PID 1 (tini) qui gère
    # correctement l'arrêt et le "reaping" des sous-process (Prism,
    # JMeter). Evite les process zombies qui bloquent le port 4010
    # et forcent des recreate/build répétés.
    init: true
    restart: unless-stopped

    ports:
      - "8000:8000"
      - "4010:4010"

    environment:
      JMETER_EXECUTABLE: /opt/jmeter/bin/jmeter
      GROQ_API_KEY: ${GROQ_API_KEY_V2}
      PRISM_PORT: 4010
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./generated:/app/generated
      - ./uploads:/app/uploads
      - ./workspace:/app/workspace
      - ./logs:/app/logs

    

    networks:
      - performance-network


  
####################################################################
# Network
####################################################################
networks:
  performance-network:
    driver: bridge