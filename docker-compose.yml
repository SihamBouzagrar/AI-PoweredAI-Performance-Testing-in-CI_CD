
name: ai-performance-platform

services:
  ####################################################################
  # FastAPI - AI Performance Testing Platform
  ####################################################################
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-performance-platform
    init: true
    restart: unless-stopped

    ports:
      - "8000:8000"
      - "4010:4010"

    environment:
      JMETER_EXECUTABLE: /opt/jmeter/bin/jmeter
      GROQ_API_KEY: ${GROQ_API_KEY_V2}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      PRISM_PORT: 4010
      PYTHONUNBUFFERED: "1"

    volumes:
      - ./generated:/app/generated
      - ./uploads:/app/uploads
      - ./workspace:/app/workspace
      - ./logs:/app/logs

    networks:
      - performance-network

####################################################################
# Network
####################################################################
networks:
  performance-network:
    driver: bridge
