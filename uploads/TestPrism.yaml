openapi: 3.0.3

info:
  title: Demo API
  version: "1.0"

servers:
  - url: /

paths:

  /hello:

    get:

      summary: Hello

      operationId: getHello

      responses:

        "200":

          description: OK

          content:

            application/json:

              example:

                message: Hello World

  /users/{id}:

    get:

      summary: Get User

      operationId: getUser

      parameters:

        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 10

      responses:

        "200":

          description: OK

          content:

            application/json:

              example:

                id: 10
                name: Alice