openapi: 3.0.3
info:
  title: API Banque Exemple
  version: "1.0"
servers:
  - url: https://api-recette.banque.interne
security:
  - bearerAuth: []
paths:
  /auth/token:
    post:
      operationId: getToken
      summary: Authentification et obtention du token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: OK

  /comptes/{id}/solde:
    get:
      operationId: getSolde
      summary: Consulter le solde d'un compte
      tags: [comptes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: devise
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK

  /virements:
    post:
      operationId: createVirement
      summary: Effectuer un virement
      tags: [virements]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                compteSource:
                  type: string
                compteDestination:
                  type: string
                montant:
                  type: number
                devise:
                  type: string
                dateExecution:
                  type: string
                  format: date
      responses:
        "201":
          description: Cree

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer