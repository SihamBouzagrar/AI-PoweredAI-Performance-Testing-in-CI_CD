swagger: "2.0"
info:
  description: >
    Pour utiliser la clé d'API, cliquer sur le bouton 'Authorize' et renseigner la clé. Vous pouvez ensuite tester l'API en cliquant sur le bouton 'Try it out' de chaque URL.<br>L'action se déroule en deux étapes : une première qui demande la génération du fichier de statistiques selon les critères date et polluant et une seconde qui télécharge le fichier demandé.<br><br>Exemple d'utilisation de la clé dans des requêtes Curl pour récupérer par exemple des moyennes horaires en NO2 sur la période du 18/11/2025 00:00 au 20/11/2025 00:00 :<br><br>1) récupération du code du polluant NO2 via le service polluant/export<br>curl -X 'GET' 'https://www.geodair.fr/api-ext/polluant/export' -H 'accept: text/csv; charset=UTF-8' -H 'apikey: $VOTRE_CLE_API'<br><br>La colonne "code" du fichier téléchargé indique le code du polluant qui devra être utilisé par la suite. Pour le NO2, le code serait : 03 .<br><br>2) récupération du code de la statistique de la moyenne horaire via le service type-donnees/export<br>curl -X 'GET' 'https://www.geodair.fr/api-ext/type-donnees/export?codes_polluants=03' -H 'accept: text/csv; charset=UTF-8' -H 'apikey: $VOTRE_CLE_API'<br><br>La colonne "Identifiant" fournit le code de la statistique qui devra être utilisé par la suite. Pour la moyenne horaire, le code serait : a1 .<br><br>3) Demande de génération du fichier :<br>curl -X 'GET' 'https://www.geodair.fr/api-ext/statistique/export?date_debut=18%2F11%2F2025%2000%3A00&date_fin=20%2F11%2F2025%2000%3A00&type_donnee=a1&polluant=03' -H 'accept: text/csv; charset=UTF-8' -H 'apikey: $VOTRE_CLE_API'<br>L'identifiant du fichier est renvoyé par l'API. Par exemple : moyenne-horaire-polluant-2019-05-08-03.845227a1a2de-16c07d8e-2bb4-4d76-9c61-55e80bac13bd .<br><br>4) Récupération du fichier : curl "https://www.geodair.fr/api-ext/download?id=$ID_DU_FICHIER" -H "apikey: $VOTRE_CLE_API". Attention, il se peut que Geod'air mette un peu de temps à produire le fichier demandé (quelques secondes max). Dans ce cas, il faut itérer sur la même url jusqu'à ce qu'elle vous fournisse le fichier demandé.<br>
  version: "1.0.0"
  title: "Geod'air API"
  termsOfService: "http://swagger.io/terms/"
  contact:
    email: "apiteam@swagger.io"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
host: "www.geodair.fr"
basePath: /api-ext
tags:
- name: "Statistiques"
  description: "Exporter des statistiques réglementaires"
- name: "Stations"
  description: "Exporter des sites de mesure conformes"
- name: "Points de prélèvement"
  description: "Exporter des points de prélèvement réglementaires"
- name: "Famille de polluant"
  description: "Export des familles de polluant"
- name: "Polluants"
  description: "Exporter des polluants"
- name: "Types de données"
  description: "Exporter des types de données"
schemes:
- "https"
- "http"
paths:
  /statistique/export-avance:
    get:
      tags:
        - "Statistiques"
      description: "Exporter des statistiques au format CSV."
      operationId: "exportStatistiquesAvance"
      produces:
        - "text/csv; charset=UTF-8"
      parameters:
        - name: "departement"
          in: "query"
          description: "Code Insee du département (2 à 3 caractères, y compris DROM)"
          required: false
          type: "string"
        - name: "region"
          in: "query"
          description: "Code Insee de la région (2 caractères)"
          required: false
          type: "string"
        - name: "zas"
          in: "query"
          description: "Code Geod’air de la ZAS (9 caractères)"
          required: false
          type: "string"
        - name: "typologie"
          in: "query"
          description: "Code Geod’air de la typologie (15 caractères)"
          required: false
          type: "string"
        - name: "influence"
          in: "query"
          description: "Id Geod’air de l’influence (15 caractères)"
          required: false
          type: "integer"
          format: "int32"
        - name: "station"
          in: "query"
          description: "Code Geod’air de la station (7 caractères)"
          required: false
          type: "string"
        - name: "date_calcul"
          in: "query"
          description: "Booléen : présence de la date d’insertion en base dans le CSV (true/false). Valeur par défaut : false"
          required: false
          type: "boolean"
        - name: "reglementaire"
          in: "query"
          description: "Inclut uniquement les données réglementaires"
          required: false
          type: "boolean"
        - name: "famille_polluant"
          in: "query"
          description: "Identifiant de la famille de polluant (entier à 4 chiffres)"
          required: false
          type: "integer"
          format: "int32"
        - name: "date_debut"
          in: "query"
          description: "Date de début de la période (format dd/MM/YYYY hh:mm)"
          required: true
          type: "string"
        - name: "date_fin"
          in: "query"
          description: "Date de fin de la période (format dd/MM/YYYY hh:mm)"
          required: true
          type: "string"
        - name: "type_donnee"
          in: "query"
          description: "Type de données/statistiques (chaîne de 3 caractères, code du type de donnée)"
          required: true
          type: "string"
        - name: "polluant"
          in: "query"
          description: "Code Geod’air du polluant (2 caractères). Optionnel si une famille de polluants est renseignée, obligatoire sinon."
          required: false
          type: "string"
      responses:
        "200":
          description: "Successful operation"
        "400":
          description: "Invalid input"
        "404":
          description: "Not found"
