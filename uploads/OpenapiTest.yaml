openapi: 3.0.3
info:
  title: API Open Banking - Exemple
  version: 1.0.0
  description: Exemple de spécification OpenAPI pour les services bancaires de base (Lecture de compte).
servers:
  - url: https://banque-exemple.fr
paths:
  /accounts/{accountId}/balances:
    get:
      summary: Récupérer le solde du compte
      description: Permet à un tiers autorisé d'obtenir le solde actuel d'un compte spécifique.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
          example: "ACC-987654321"
      responses:
        '200':
          description: Solde récupéré avec succès.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Data:
                    type: object
                    properties:
                      AccountId:
                        type: string
                        example: "ACC-987654321"
                      Amount:
                        type: object
                        properties:
                          Amount:
                            type: string
                            example: "1250.00"
                          Currency:
                            type: string
                            example: "MAD"
                      CreditDebitIndicator:
                        type: string
                        enum:
                          - Credit
                          - Debit
                        example: "Credit"
        '401':
          description: Non autorisé (Jeton OAuth manquant ou expiré)
        '404':
          description: Compte non trouvé
